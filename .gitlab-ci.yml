# Earned Autonomy pipeline.
#
# Every change gets evidence, a risk score and an autonomy level:
#   Hands-off (ship with no human) / Supervised (one approval) / Assisted (approve each step).
#
#   secure   dependency-audit-reachability  locked deps -> pip-audit -> "is the vulnerable
#                                           function reachable from an HTTP route?" (static call graph)
#   verify   test                           app test suite + our tools' tests (JUnit in the MR widget)
#            replay-recorded-traffic        this commit's app + fresh Postgres; replay recorded real
#                                           traffic; diff behaviour; count runtime hits on vulnerable functions
#   configure configure-plan               terraform plan (MRs touching infra/) -> risky changes + cost delta
#   release  autonomy-decision              evidence bundle -> risk score -> level -> proof card on the MR
#
# After merge (main): package-image -> deploy-staging (Terraform, Cloud Run) -> route-by-autonomy
#   (reads the merged MR's autonomy:: label) -> promote-production: automatic for Hands-off,
#   a manual approval job for Supervised/Assisted. Auth: GitLab OIDC -> Workload Identity, no keys.
#   Then monitor-prod: canary replay of the new prod revision vs the previous one on the same
#   prod data; any difference -> automatic rollback (traffic pinned to previous), outcome written
#   to the trust ledger in GCS (gs://$EA_LEDGER_BUCKET/trust/ledger.jsonl), job fails -> the
#   Rollback agent (Duo flow, pipeline failed) opens an incident. Every MR decision reads that ledger.
# Rules, levels and calibration: docs/risk-model.md. Scripts: ci/*.sh.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - secure
  - configure
  - verify
  - release
  - package
  - deploy-staging
  - route
  - promote
  - govern

variables:
  UV_VERSION: "0.9.26"
  PIP_AUDIT_VERSION: "2.9.0"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: copy
  PYTHONUTF8: "1"
  # Throwaway CI database; the same test-only values as the committed .env.
  POSTGRES_DB: app
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: changethis
  DATABASE_URL: "postgresql://postgres:changethis@postgres:5432/app"
  EA_USERNAME: admin@example.com
  EA_PASSWORD: changethis
  # Google Cloud (not secrets: access is granted by Workload Identity Federation to
  # this project's CI jobs only; see infra/bootstrap.sh).
  GCP_PROJECT: mercurial-lamp-512205-q5
  GCP_PROJECT_NUMBER: "864260570183"
  GCP_REGION: us-central1
  GCP_DEPLOYER_SA: gitlab-deployer@mercurial-lamp-512205-q5.iam.gserviceaccount.com
  IMAGE_REPO: us-central1-docker.pkg.dev/mercurial-lamp-512205-q5/earned-autonomy/api
  EA_LEDGER_BUCKET: mercurial-lamp-512205-q5-tfstate  # trust ledger: gs://<bucket>/trust/ledger.jsonl

default:
  image: python:3.14
  interruptible: true
  cache:
    key:
      files: [uv.lock]
    paths: [.uv-cache/]
  before_script:
    - bash ci/setup.sh
    - export PATH="$CI_PROJECT_DIR/.venv/bin:$PATH"

.postgres:
  services:
    - name: postgres:18
      alias: postgres

dependency-audit-reachability:
  stage: secure
  variables:
    GIT_DEPTH: "0"  # the MR's target-branch commit, to tell new findings from pre-existing ones
  script:
    - bash ci/secure.sh
  artifacts:
    when: always
    paths: [reports/]
    expire_in: 30 days

test:
  stage: verify
  extends: .postgres
  needs: []
  script:
    - bash ci/verify-tests.sh
  artifacts:
    when: always
    paths: [reports/]
    reports:
      junit: [reports/junit.xml, reports/junit-tools.xml]
    expire_in: 30 days

replay-recorded-traffic:
  stage: verify
  extends: .postgres
  needs: [dependency-audit-reachability]
  script:
    - bash ci/verify-replay.sh
  artifacts:
    when: always
    paths: [reports/]
    expire_in: 30 days

# VERIFY (frontend): lint, type-check and build the React app, then run the template's
# Playwright tests against the backend serving that build.
frontend-check:
  stage: verify
  image: oven/bun:1.3
  needs: []
  cache: []
  before_script: []
  script:
    - bun install --frozen-lockfile
    - cd frontend && bunx biome lint --no-errors-on-unmatched --files-ignore-unknown=true ./ && VITE_API_URL= bun run build  # same origin: override the dev .env (localhost:8000)
  artifacts:
    paths: [backend/app/frontend/]
    expire_in: 7 days

frontend-e2e:
  stage: verify
  image: mcr.microsoft.com/playwright:v1.63.0-noble
  services:
    - name: postgres:18
      alias: postgres
    - name: axllent/mailpit
      alias: mailpit
  variables:
    # Password-recovery tests read the email the backend sends (as in the template's compose).
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    SMTP_TLS: "false"
    MAILPIT_HOST: http://mailpit:8025
  needs: [frontend-check]
  cache: []
  before_script: []
  script:
    - bash ci/verify-frontend-e2e.sh
  artifacts:
    when: always
    paths: [reports/, frontend/test-results/]
    reports:
      junit: reports/junit-frontend.xml
    expire_in: 30 days

autonomy-decision:
  stage: release
  # Runs even when tests fail: failing tests are evidence (the level becomes Blocked).
  when: always
  id_tokens:  # read the shared trust ledger from GCS (keyless)
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com
  variables:
    GIT_DEPTH: "0"  # diff against the MR's target branch, mapped to changed functions and routes
  needs:
    - dependency-audit-reachability
    - test
    - replay-recorded-traffic
    - frontend-e2e
    - job: configure-plan
      optional: true
  script:
    - bash ci/release-decide.sh
  artifacts:
    when: always
    expose_as: "Autonomy proof card"
    paths: [reports/proofcard.md, reports/bundle.json]
    reports:
      dotenv: reports/decision.env
    expire_in: 90 days

configure-plan:
  stage: configure
  extends: .gcp-oidc
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  cache: []
  before_script: []
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [infra/**/*]
  script:
    - sh ci/plan.sh
  artifacts:
    when: always
    paths: [reports/plan.json]
    expire_in: 30 days

# ---------------------------------------------------------------- after merge (main)
# package -> deploy staging -> route by the merged MR's autonomy:: label -> promote prod

.main-only:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.gcp-oidc:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com

package-image:
  extends: [.main-only, .gcp-oidc]
  stage: package
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  cache: []
  before_script: []
  needs: []
  script:
    - apk add -q --no-cache curl jq
    - . ci/gcp-token.sh
    - echo "$GCP_ACCESS_TOKEN" | docker login -u oauth2accesstoken --password-stdin "https://${GCP_REGION}-docker.pkg.dev"
    - docker build -f infra/Dockerfile.api -t "${IMAGE_REPO}:${CI_COMMIT_SHA}" .
    - docker push -q "${IMAGE_REPO}:${CI_COMMIT_SHA}"
    - mkdir -p reports
    - echo "EA_IMAGE=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_REPO}:${CI_COMMIT_SHA}")" | tee reports/image.env
  artifacts:
    reports:
      dotenv: reports/image.env

deploy-staging:
  extends: [.main-only, .gcp-oidc]
  stage: deploy-staging
  image:
    name: hashicorp/terraform:1.9.8
    entrypoint: [""]
  cache: []
  before_script: []
  needs: [package-image]
  interruptible: false  # never cancel a terraform apply halfway
  environment:
    name: staging
    url: $STAGING_URL
  script:
    - sh ci/deploy.sh staging "$EA_IMAGE"
  artifacts:
    when: always
    paths: [reports/]
    reports:
      dotenv: reports/deploy-staging.env

route-by-autonomy:
  extends: .main-only
  stage: route
  image: alpine:3.20
  cache: []
  before_script: []
  needs: [package-image, deploy-staging]
  script:
    - sh ci/route.sh
  artifacts:
    paths: [reports/promote.yml, reports/route.env]
    reports:
      dotenv: reports/route.env

promote-production:
  extends: .main-only
  stage: promote
  needs: [route-by-autonomy]
  trigger:
    include:
      - artifact: reports/promote.yml
        job: route-by-autonomy
    strategy: depend

# GOVERN: publish the trust ledger (GitLab Pages) once the release and its prod monitor
# have finished, including after a rollback. The page is a pure function of the ledger.
pages:
  stage: govern
  extends: .gcp-oidc
  image: python:3.14-slim
  cache: []
  before_script: []
  needs:
    - job: promote-production
      optional: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
  script:
    - pip install -q --root-user-action=ignore ./tools
    - ea-ledger pull --bucket "$EA_LEDGER_BUCKET" --out .trust/ledger.jsonl
    - ea-ledger report --ledger .trust/ledger.jsonl --notes .trust/notes.json
        --source "gs://$EA_LEDGER_BUCKET/trust/ledger.jsonl" --out public/index.html
  artifacts:
    paths: [public]
