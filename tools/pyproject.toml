[project]
name = "earned-autonomy-tools"
version = "0.1.0"
description = "Evidence collectors for Earned Autonomy: static reachability, traffic replay, plan parsing, risk scoring."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
ea-callgraph = "callgraph.cli:main"
ea-replay = "replay.cli:main"
ea-risk = "risk.cli:main"
ea-proofcard = "proofcard.post:main"
ea-tfplan = "tfplan.cli:main"
ea-ledger = "risk.gcs:main"
ea-monitor = "monitor.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["callgraph", "replay", "runtime_hits", "risk", "proofcard", "tfplan", "monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
